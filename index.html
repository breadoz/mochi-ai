<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mochi — Your Little Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fdf0f8 0%, #f0f4ff 50%, #f5fff0 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: #3d2b4a;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #7c4f9a;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #a07cb8;
      margin-bottom: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Pet Display ── */
    .pet-card {
      background: white;
      border-radius: 28px;
      padding: 24px 20px 20px;
      box-shadow: 0 4px 24px rgba(124, 79, 154, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .pet-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #f9a8d4, #c4b5fd, #93c5fd);
    }

    .scene {
      width: 200px;
      height: 180px;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    /* Jar */
    .jar {
      position: absolute;
      bottom: 0;
      width: 130px;
      height: 120px;
    }

    .jar-body {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 100px;
      background: rgba(200, 230, 255, 0.35);
      border-radius: 0 0 55px 55px;
      border: 2px solid rgba(180, 210, 240, 0.6);
      backdrop-filter: blur(4px);
    }

    .jar-rim {
      position: absolute;
      bottom: 96px;
      left: 50%;
      transform: translateX(-50%);
      width: 118px;
      height: 12px;
      background: rgba(180, 210, 240, 0.5);
      border-radius: 8px;
      border: 2px solid rgba(160, 195, 230, 0.7);
    }

    .jar-shine {
      position: absolute;
      bottom: 20px;
      left: calc(50% - 45px);
      width: 18px;
      height: 50px;
      background: rgba(255,255,255,0.4);
      border-radius: 10px;
      transform: rotate(-15deg);
    }

    /* Fill level */
    .fill-level {
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 106px;
      background: linear-gradient(180deg, rgba(255,182,193,0.5) 0%, rgba(255,218,185,0.6) 100%);
      border-radius: 0 0 53px 53px;
      transition: height 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Mochi pet */
    .mochi {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 65px;
      cursor: pointer;
      transition: bottom 0.5s ease;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-6px); }
    }

    .mochi.bounce {
      animation: bounce 0.5s ease 3;
    }

    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.15); }
    }

    .mochi.shake {
      animation: shake 0.4s ease 2;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(-50%) rotate(0); }
      25% { transform: translateX(calc(-50% - 4px)) rotate(-5deg); }
      75% { transform: translateX(calc(-50% + 4px)) rotate(5deg); }
    }

    /* Mochi SVG body parts via CSS */
    .mochi-svg { width: 100%; height: 100%; }

    /* Stars / sparkles on happy state */
    .sparkle {
      position: absolute;
      font-size: 1.2rem;
      animation: sparkle-float 1.5s ease-out forwards;
      pointer-events: none;
    }

    @keyframes sparkle-float {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-50px) scale(0.5); }
    }

    /* Status bar */
    .status-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .state-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #9a6bc2;
      letter-spacing: 0.04em;
    }

    .hunger-bar-track {
      width: 160px;
      height: 10px;
      background: #f0e8f8;
      border-radius: 10px;
      overflow: hidden;
    }

    .hunger-bar-fill {
      height: 100%;
      border-radius: 10px;
      transition: width 1s ease, background 1s ease;
    }

    .timer-text {
      font-size: 0.75rem;
      color: #b09ac8;
    }

    /* ── Chat ── */
    .chat-card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 4px 24px rgba(124, 79, 154, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-messages {
      height: 280px;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #e0d0f0; border-radius: 2px; }

    .message {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      max-width: 88%;
    }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.mochi-msg { align-self: flex-start; }

    .message-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }

    .mochi-msg .message-avatar {
      background: linear-gradient(135deg, #f9a8d4, #c4b5fd);
    }

    .user .message-avatar {
      background: linear-gradient(135deg, #93c5fd, #6ee7b7);
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 0.88rem;
      line-height: 1.5;
      max-width: 100%;
    }

    .mochi-msg .bubble {
      background: #faf0ff;
      border: 1px solid #ede0f8;
      border-bottom-left-radius: 4px;
      color: #3d2b4a;
    }

    .user .bubble {
      background: linear-gradient(135deg, #7c4f9a, #9b6bc8);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .typing-bubble .bubble {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 14px;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: #c4b5fd;
      border-radius: 50%;
      animation: typing 1.2s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 80%, 100% { transform: scale(1); opacity: 0.5; }
      40% { transform: scale(1.3); opacity: 1; }
    }

    .chat-input-area {
      border-top: 1px solid #f0e8f8;
      padding: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      background: #fdfaff;
    }

    .chat-input {
      flex: 1;
      border: 1.5px solid #e0d0f0;
      border-radius: 20px;
      padding: 9px 14px;
      font-size: 0.88rem;
      font-family: inherit;
      color: #3d2b4a;
      background: white;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
    }

    .chat-input:focus { border-color: #9b6bc8; }

    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #7c4f9a, #9b6bc8);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, opacity 0.15s;
      flex-shrink: 0;
    }

    .send-btn:hover { transform: scale(1.08); }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Quick action buttons ── */
    .quick-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .quick-btn {
      border: 1.5px solid #e0d0f0;
      background: white;
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 0.8rem;
      cursor: pointer;
      color: #7c4f9a;
      font-family: inherit;
      transition: all 0.2s;
      font-weight: 500;
    }

    .quick-btn:hover {
      background: #f5eeff;
      border-color: #c4b5fd;
    }

    .quick-btn.meal-btn {
      background: linear-gradient(135deg, #fdf0f8, #f5eeff);
      border-color: #f9a8d4;
      color: #9b4fa0;
    }

    /* ── Resources ── */
    .resources {
      font-size: 0.72rem;
      color: #b09ac8;
      text-align: center;
      padding: 4px;
      line-height: 1.6;
    }

    .resources a { color: #9b6bc8; }

    /* State-based colors */
    body.state-ecstatic { background: linear-gradient(135deg, #fff0f9 0%, #f5f0ff 50%, #f0fff5 100%); }
    body.state-worried { background: linear-gradient(135deg, #fff8f0 0%, #fef0f0 50%, #fff0f8 100%); }
    body.state-distressed { background: linear-gradient(135deg, #fff0f0 0%, #ffeef0 50%, #fff0f0 100%); }
  </style>
</head>
<body class="state-happy">

<div class="app-container">
  <div style="text-align:center">
    <h1>🍙 Mochi</h1>
    <div class="subtitle">your little companion</div>
  </div>

  <!-- Pet Display -->
  <div class="pet-card" id="petCard">
    <div class="scene" id="scene">
      <!-- Jar -->
      <div class="jar">
        <div class="jar-body">
          <div class="fill-level" id="fillLevel" style="height: 30px"></div>
          <div class="jar-shine"></div>
        </div>
        <div class="jar-rim"></div>
      </div>

      <!-- Mochi creature -->
      <div class="mochi" id="mochi" onclick="petMochi()">
        <svg class="mochi-svg" viewBox="0 0 70 65" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Body -->
          <ellipse id="mochiBody" cx="35" cy="36" rx="28" ry="25" fill="#fff0f8"/>
          <ellipse cx="35" cy="36" rx="28" ry="25" fill="url(#bodyGrad)" opacity="0.6"/>

          <!-- Cheeks -->
          <ellipse id="cheekL" cx="19" cy="39" rx="6" ry="4" fill="#ffb3c6" opacity="0.5"/>
          <ellipse id="cheekR" cx="51" cy="39" rx="6" ry="4" fill="#ffb3c6" opacity="0.5"/>

          <!-- Eyes -->
          <g id="eyes-happy">
            <path d="M24 33 Q27 30 30 33" stroke="#5a3070" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <path d="M40 33 Q43 30 46 33" stroke="#5a3070" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          </g>
          <g id="eyes-sad" style="display:none">
            <path d="M24 31 Q27 34 30 31" stroke="#5a3070" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <path d="M40 31 Q43 34 46 31" stroke="#5a3070" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <!-- Tear drops -->
            <ellipse id="tearL" cx="24" cy="36" rx="2" ry="3" fill="#93c5fd" opacity="0"/>
            <ellipse id="tearR" cx="46" cy="36" rx="2" ry="3" fill="#93c5fd" opacity="0"/>
          </g>
          <g id="eyes-sleepy" style="display:none">
            <line x1="22" y1="32" x2="30" y2="32" stroke="#5a3070" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="40" y1="32" x2="48" y2="32" stroke="#5a3070" stroke-width="2.5" stroke-linecap="round"/>
          </g>

          <!-- Mouth -->
          <path id="mouth-happy" d="M28 43 Q35 49 42 43" stroke="#5a3070" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path id="mouth-neutral" d="M29 44 Q35 46 41 44" stroke="#5a3070" stroke-width="2" stroke-linecap="round" fill="none" style="display:none"/>
          <path id="mouth-sad" d="M29 47 Q35 42 41 47" stroke="#5a3070" stroke-width="2" stroke-linecap="round" fill="none" style="display:none"/>

          <!-- Tiny arms -->
          <path id="armL" d="M9 36 Q5 30 10 26" stroke="#ffb3c6" stroke-width="4" stroke-linecap="round" fill="none"/>
          <path id="armR" d="M61 36 Q65 30 60 26" stroke="#ffb3c6" stroke-width="4" stroke-linecap="round" fill="none"/>

          <!-- Belly dot -->
          <ellipse cx="35" cy="44" rx="5" ry="3.5" fill="#ffd6e7" opacity="0.6"/>

          <!-- Gradient defs -->
          <defs>
            <radialGradient id="bodyGrad" cx="40%" cy="35%">
              <stop offset="0%" stop-color="white" stop-opacity="0.8"/>
              <stop offset="100%" stop-color="#f9a8d4" stop-opacity="0.3"/>
            </radialGradient>
          </defs>
        </svg>
      </div>
    </div>

    <!-- Status -->
    <div class="status-area">
      <div class="state-label" id="stateLabel">feeling cozy ✨</div>
      <div class="hunger-bar-track">
        <div class="hunger-bar-fill" id="hungerBar" style="width: 70%; background: linear-gradient(90deg, #f9a8d4, #c4b5fd)"></div>
      </div>
      <div class="timer-text" id="timerText">last meal: just now</div>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-card">
    <div class="chat-messages" id="chatMessages">
      <div class="message mochi-msg">
        <div class="message-avatar">🍙</div>
        <div class="bubble">Hi! I'm Mochi, your little jar companion 💕 I'm so happy you're here. How are you doing today?</div>
      </div>
    </div>
    <div class="chat-input-area">
      <input
        type="text"
        class="chat-input"
        id="chatInput"
        placeholder="Talk to Mochi..."
        onkeydown="if(event.key==='Enter') sendMessage()"
        autocomplete="off"
      />
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <!-- Resources -->
  <div class="resources">
    If you need support: <strong>NEDA Helpline</strong> 1-800-931-2237<br/>
    or text "NEDA" to 741741 · <a href="https://www.nationaleatingdisorders.org" target="_blank">nationaleatingdisorders.org</a>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────
  let lastMealTime = null;
  let conversationHistory = [];
  let currentPetState = 'happy';
  let updateInterval;

  const STATES = {
    ecstatic: { label: 'SO full and happy!! 🌸', barColor: 'linear-gradient(90deg, #f9a8d4, #fbbf24)', barWidth: 100, fillHeight: 88, bodyColor: '#fff0fc' },
    happy:    { label: 'feeling cozy ✨',         barColor: 'linear-gradient(90deg, #f9a8d4, #c4b5fd)', barWidth: 70,  fillHeight: 55, bodyColor: '#fff0f8' },
    content:  { label: 'doing okay 🌿',           barColor: 'linear-gradient(90deg, #c4b5fd, #93c5fd)', barWidth: 45,  fillHeight: 35, bodyColor: '#f8f0ff' },
    worried:  { label: 'getting a bit hungry…',   barColor: 'linear-gradient(90deg, #fbbf24, #f97316)', barWidth: 22,  fillHeight: 18, bodyColor: '#fff8f0' },
    distressed:{ label: 'missing you… 🥺',        barColor: 'linear-gradient(90deg, #f97316, #ef4444)', barWidth: 8,   fillHeight: 6,  bodyColor: '#fff0f0' },
  };

  // ── Pet state calculation ──────────────────────────────
  function getMinutesSinceLastMeal() {
    if (!lastMealTime) return null;
    return Math.floor((Date.now() - lastMealTime) / 60000);
  }

  function computePetState() {
    const mins = getMinutesSinceLastMeal();
    if (mins === null) return 'content';
    if (mins < 5)   return 'ecstatic';
    if (mins < 180) return 'happy';
    if (mins < 300) return 'content';
    if (mins < 480) return 'worried';
    return 'distressed';
  }

  function updatePetVisuals() {
    const state = computePetState();
    const s = STATES[state];
    currentPetState = state;

    // Bar & fill
    document.getElementById('hungerBar').style.width = s.barWidth + '%';
    document.getElementById('hungerBar').style.background = s.barColor;
    document.getElementById('fillLevel').style.height = s.fillHeight + 'px';
    document.getElementById('stateLabel').textContent = s.label;
    document.getElementById('mochiBody').style.fill = s.bodyColor;

    // Eyes & mouth
    const happyEyes = document.getElementById('eyes-happy');
    const sadEyes   = document.getElementById('eyes-sad');
    const sleepyEyes = document.getElementById('eyes-sleepy');
    const mouthH = document.getElementById('mouth-happy');
    const mouthN = document.getElementById('mouth-neutral');
    const mouthS = document.getElementById('mouth-sad');

    happyEyes.style.display = 'none';
    sadEyes.style.display   = 'none';
    sleepyEyes.style.display = 'none';
    mouthH.style.display = 'none';
    mouthN.style.display = 'none';
    mouthS.style.display = 'none';

    if (state === 'ecstatic' || state === 'happy') {
      happyEyes.style.display = '';
      mouthH.style.display = '';
    } else if (state === 'content') {
      happyEyes.style.display = '';
      mouthN.style.display = '';
    } else if (state === 'worried') {
      sleepyEyes.style.display = '';
      mouthN.style.display = '';
    } else {
      sadEyes.style.display = '';
      mouthS.style.display = '';
      // Show tears
      document.getElementById('tearL').style.opacity = '0.8';
      document.getElementById('tearR').style.opacity = '0.8';
    }

    if (state !== 'distressed') {
      document.getElementById('tearL').style.opacity = '0';
      document.getElementById('tearR').style.opacity = '0';
    }

    // Body class
    document.body.className = 'state-' + state;

    // Timer
    const mins = getMinutesSinceLastMeal();
    const timerEl = document.getElementById('timerText');
    if (mins === null) {
      timerEl.textContent = "haven't tracked a meal yet";
    } else if (mins < 1) {
      timerEl.textContent = 'last meal: just now 🍽️';
    } else if (mins < 60) {
      timerEl.textContent = `last meal: ${mins} min ago`;
    } else {
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      timerEl.textContent = `last meal: ${h}h ${m}m ago`;
    }
  }

  // ── Chat ───────────────────────────────────────────────
  function appendMessage(role, text) {
    const container = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'message ' + (role === 'user' ? 'user' : 'mochi-msg');

    const avatar = document.createElement('div');
    avatar.className = 'message-avatar';
    avatar.textContent = role === 'user' ? '🫶' : '🍙';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    div.appendChild(avatar);
    div.appendChild(bubble);
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return div;
  }

  function showTyping() {
    const container = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'message mochi-msg typing-bubble';
    div.id = 'typingIndicator';

    const avatar = document.createElement('div');
    avatar.className = 'message-avatar';
    avatar.textContent = '🍙';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

    div.appendChild(avatar);
    div.appendChild(bubble);
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function spawnSparkles() {
    const scene = document.getElementById('scene');
    const emojis = ['✨', '🌸', '💕', '⭐', '🎉'];
    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        s.style.left = (20 + Math.random() * 160) + 'px';
        s.style.top = (10 + Math.random() * 80) + 'px';
        scene.appendChild(s);
        setTimeout(() => s.remove(), 1600);
      }, i * 150);
    }
  }

  async function sendMessage(overrideText) {
    const input = document.getElementById('chatInput');
    const message = overrideText || input.value.trim();
    if (!message) return;

    input.value = '';
    document.getElementById('sendBtn').disabled = true;

    appendMessage('user', message);
    conversationHistory.push({ role: 'user', content: message });

    showTyping();

    try {
      const mins = getMinutesSinceLastMeal();
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message,
          petState: computePetState(),
          minutesSinceLastMeal: mins,
          conversationHistory: conversationHistory.slice(-10),
        }),
      });

      const data = await res.json();
      removeTyping();

      if (data.hasMealMention) {
        lastMealTime = Date.now();
        updatePetVisuals();
        document.getElementById('mochi').classList.remove('bounce', 'shake');
        void document.getElementById('mochi').offsetWidth;
        document.getElementById('mochi').classList.add('bounce');
        spawnSparkles();
      }

      appendMessage('mochi', data.reply);
      conversationHistory.push({ role: 'assistant', content: data.reply });

      // Keep history trimmed
      if (conversationHistory.length > 20) {
        conversationHistory = conversationHistory.slice(-16);
      }
    } catch (err) {
      removeTyping();
      appendMessage('mochi', "Oh no, I lost connection for a second! 😥 Are you still there?");
    }

    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }

  function quickMessage(text) {
    document.getElementById('chatInput').value = text;
    sendMessage(text);
  }

  function petMochi() {
    const el = document.getElementById('mochi');
    el.classList.remove('bounce', 'shake');
    void el.offsetWidth;
    el.classList.add('bounce');
    setTimeout(() => el.classList.remove('bounce'), 1600);
  }

  // ── Init ───────────────────────────────────────────────
  updatePetVisuals();
  updateInterval = setInterval(updatePetVisuals, 30000);

  // Shake when distressed periodically
  setInterval(() => {
    if (currentPetState === 'distressed') {
      const el = document.getElementById('mochi');
      el.classList.remove('shake');
      void el.offsetWidth;
      el.classList.add('shake');
    }
  }, 8000);
</script>
</body>
</html>
